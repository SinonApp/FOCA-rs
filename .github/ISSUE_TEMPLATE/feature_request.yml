name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Writing in Russian or Ukrainian is welcome too.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or the problem behind the idea, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could FOCA-rs help?
      description: What would you like to see in the app? Sketches and examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Related roadmap items, links, or how you work around it today.
    validations:
      required: false
