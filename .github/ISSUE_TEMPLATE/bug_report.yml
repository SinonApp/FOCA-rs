name: Bug report
description: Something does not work as expected
labels: [bug, beta-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Writing in Russian or Ukrainian is welcome too.

        **Please do not post secrets:** API keys, passwords, client names or full scan results.
        The logs ZIP from the app already has secrets removed.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › About shows it, e.g. `2.0.0-beta.3 FOSS`.
      placeholder: 2.0.0-beta.3 FOSS
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, Android version and firmware
      description: Model, Android version and the vendor shell if any (HyperOS, One UI, ColorOS…).
      placeholder: Xiaomi 14T, Android 15, HyperOS 2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see it ourselves? A public test target is better than a real client domain.
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        In the app: tap **Report a problem** (beta note or Settings › About), or Settings › Debug › Log › Share.
        The ZIP lands in `Download/FOCA-rs/`: drag it into this field. It contains `foca.log`, `android.log`,
        crash reports and `device.txt`.
      placeholder: Attach the FOCA-rs_logs_*.zip here
    validations:
      required: false
  - type: textarea
    id: device_txt
    attributes:
      label: device.txt
      description: If you cannot attach the ZIP, paste the contents of `device.txt` from it (Settings › Debug › Device › Copy works too).
      render: text
    validations:
      required: false
