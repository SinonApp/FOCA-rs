# Weekly refresh of the live signature data (CISA KEV, FIRST EPSS, NVD CVE feeds), signed bundles
# for the in-app update feeds and a pull request with the refreshed data files.
# Setup (secret SIG_SEED in the protected environment "signing") and the step order:
# docs/dev/signature-bundles.md#scheduled-refresh-github-actions
name: Signature data

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the signed bundles to the signatures and signatures-v3 releases
        type: boolean
        default: true
      pinned:
        description: Also re-run the pinned sources (webappanalyzer, endoflife, gitleaks, ...) to check their hashes
        type: boolean
        default: false

permissions: {}

concurrency:
  group: signature-data
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  refresh:
    name: Refresh data and test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check pyyaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: signatures
      - name: Move the live feed pins (EPSS date, NVD snapshot)
        run: python3 crates/foca-analysis/signatures/tools/bump_live_pins.py
      - name: Ingest (order of docs/dev/signature-bundles.md)
        env:
          FOCA_SIG_CACHE: ${{ runner.temp }}/foca-sig
          PINNED: ${{ inputs.pinned && '1' || '' }}
        run: |
          set -euo pipefail
          sig=crates/foca-analysis/signatures
          python3 "$sig/update_kev.py"
          if [ -n "$PINNED" ]; then
            # Pinned sources: same commit, the hash check must pass without --repin.
            for s in webappanalyzer endoflife gitleaks retire recog psl takeover; do
              python3 "$sig/tools/update_$s.py"
            done
          fi
          # Live feeds: new upstream hashes are expected.
          python3 "$sig/tools/update_kev_enrich.py" --repin
          python3 "$sig/tools/update_nvd.py" --repin
          python3 qa/gen-licenses.py
      - name: Tests
        run: |
          set -euo pipefail
          python3 crates/foca-analysis/signatures/tools/test_update_nvd.py
          cargo test -p foca-analysis
          cargo test -p foca-engine --lib sigbundle
          python3 qa/gen-licenses.py --check
      - name: Collect the changed data files
        id: diff
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/signature-data.patch"
          git diff --stat
          if [ -s "$RUNNER_TEMP/signature-data.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature-data
          path: ${{ runner.temp }}/signature-data.patch
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and publish bundles
    needs: refresh
    # Publishing from CI is opt-in: set the repository variable SIGNING_ENABLED=true after adding
    # SIG_SEED to the "signing" environment. Without it the refresh and the pull request still run and
    # the maintainer signs and uploads the bundles locally (scripts/build-sig-bundle.sh).
    if: vars.SIGNING_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature-data
          path: ${{ runner.temp }}
      - name: Apply the refreshed data
        run: |
          if [ -s "$RUNNER_TEMP/signature-data.patch" ]; then git apply --binary "$RUNNER_TEMP/signature-data.patch"; fi
          git status --short
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: signatures-release
      - name: Build and sign both bundles
        env:
          SIG_SEED: ${{ secrets.SIG_SEED }}
        run: |
          set -euo pipefail
          if [ -z "$SIG_SEED" ]; then
            echo "::error::secret SIG_SEED is not set in the signing environment"
            exit 1
          fi
          seed=$(mktemp "$RUNNER_TEMP/seed.XXXXXX")
          trap 'rm -f "$seed"' EXIT
          chmod 600 "$seed"
          printf '%s' "$SIG_SEED" > "$seed"
          mkdir -p "$RUNNER_TEMP/bundles"
          scripts/build-sig-bundle.sh "$seed" "$RUNNER_TEMP/bundles/signatures-v3.bundle" \
            --schema both --version "$(date -u +%Y.%m.%d)" --released "$(date -u +%F)"
          rm -f "$seed"
      - name: Verify against the key built into the app
        run: |
          set -euo pipefail
          for b in signatures-v3.bundle signatures.bundle; do
            cargo run -q -p foca-engine --release --example sig_bundle -- verify "$RUNNER_TEMP/bundles/$b"
          done
          python3 - "$RUNNER_TEMP/bundles" <<'PY'
          import json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          v3 = json.loads((d / "signatures-v3.bundle").read_text())
          v2 = json.loads((d / "signatures.bundle").read_text())
          assert v3["schema"] == "foca-sig-bundle/v3", v3["schema"]
          assert v2["schema"] == "foca-sig-bundle/v2", v2["schema"]
          assert "nvd_cve" not in v2["tables"], "v3-only table in the v2 bundle"
          print("schemas OK:", v3["version"], v2["version"])
          PY
      - name: Replace the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload signatures-v3 "$RUNNER_TEMP/bundles/signatures-v3.bundle" --clobber
          gh release upload signatures "$RUNNER_TEMP/bundles/signatures.bundle" --clobber

  pull-request:
    name: Pull request with the refreshed data
    needs: [refresh, sign]
    if: always() && needs.refresh.result == 'success' && needs.refresh.outputs.changed == 'true' && needs.sign.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature-data
          path: ${{ runner.temp }}
      - run: git apply --binary "$RUNNER_TEMP/signature-data.patch"
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: signatures/data-refresh
          delete-branch: true
          commit-message: "chore(signatures): refresh KEV, EPSS and NVD data (${{ steps.date.outputs.day }})"
          title: "chore(signatures): refresh KEV, EPSS and NVD data (${{ steps.date.outputs.day }})"
          body: |
            Scheduled refresh of the live signature feeds (CISA KEV, FIRST EPSS, NVD CVE feeds) by
            `.github/workflows/signatures.yml`. Pinned sources are unchanged. The tests of
            foca-analysis, the foca-engine bundle tests and `gen-licenses.py --check` passed on
            this data, and the signed bundles built from it were published to the `signatures`
            and `signatures-v3` releases (unless the run was started without publishing).
          add-paths: |
            crates/foca-analysis/signatures/*.gz
            crates/foca-analysis/signatures/sources.lock.json
            crates/foca-analysis/signatures/tools/update_kev_enrich.py
            crates/foca-analysis/signatures/tools/update_nvd.py
            crates/foca-recon/data/*
            crates/foca-net/data/*
            crates/foca-engine/data/licenses.json
            NOTICE
            THIRD_PARTY.md
