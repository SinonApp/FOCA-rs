# Software and OS signatures (counterpart of FOCA's ApplicationAnalysis).
#
# Each [[software]] / [[os]] entry matches its `re` regex against metadata strings:
# Application/Creator, Producer, xmp:CreatorTool, EXIF Software, app.xml AppVersion
# (already joined with Application in `software`), OLE OS, and for photos the string
# "<Make> <Model> | <Software>". The first matching entry wins, so order matters:
# specific patterns go above generic ones.
#
# Named groups: `v` is the version, `app` the application (Word/Excel/…).
# `versions` refines by version: key `v` matches the captured version as a whole or as a
# component prefix ("7.2" ⊂ "7.2.5.2", but not "7.25"); the longest key wins.
# Substitutions in id/name: {app} as captured, {app_id} word/excel/ppt/outlook/visio…,
# {version} the captured version, {ver_id} the version without dots, {key} the version key without dots.
# A version without `id` gets id = <entry id> + {key}.
#
# eol is the vendor end-of-support date (ISO); legacy = true means the product is out of
# support with no published date. A document is "outdated" if eol < today or legacy.
# Date sources: Microsoft Lifecycle, Adobe Support Lifecycle, LibreOffice Release Plan,
# Oracle (OpenOffice.org, 15.04.2011). iOS dates are the release of iOS N+2 (when security
# updates stop in practice; Apple does not publish dates).

# ---------------- Microsoft Office ----------------

[[software]]
id = "{app_id}365"
name = "Microsoft {app} для Microsoft 365"
kind = "office"
re = '(?i)^Microsoft(?:®)?\s+(?:Office\s+)?(?P<app>Word|Excel|PowerPoint|Outlook|Visio|Publisher|OneNote)(?:®)?\s+(?:for|für|pour|para|per|для)\s+(?:Microsoft|Office)\s*365'

[[software]]
id = "{app_id}"
name = "Microsoft Office {app}"
kind = "office"
re = '(?i)^Microsoft(?:®)?\s+(?:Office\s+)?(?P<app>Word|Excel|PowerPoint|Outlook|Visio|Publisher|OneNote|Access)(?:®)?\s+(?P<v>20\d\d)\b'
versions = [
  { v = "2003", id = "{app_id}2003", name = "Microsoft Office {app} 2003", released = 2003, eol = "2014-04-08" },
  { v = "2007", id = "{app_id}2007", name = "Microsoft Office {app} 2007", released = 2007, eol = "2017-10-10" },
  { v = "2010", id = "{app_id}2010", name = "Microsoft {app} 2010", released = 2010, eol = "2020-10-13" },
  { v = "2013", id = "{app_id}2013", name = "Microsoft Office {app} 2013", released = 2013, eol = "2023-04-11" },
  { v = "2016", id = "{app_id}2016", name = "Microsoft Office {app} 2016", released = 2016, eol = "2025-10-14" },
  { v = "2019", id = "{app_id}2019", name = "Microsoft Office {app} 2019", released = 2019, eol = "2025-10-14" },
  { v = "2021", id = "{app_id}2021", name = "Microsoft Office {app} LTSC 2021", released = 2021, eol = "2026-10-13" },
  { v = "2024", id = "{app_id}2024", name = "Microsoft Office {app} LTSC 2024", released = 2024, eol = "2029-10-09" },
]

[[software]]
id = "mac{app_id}"
name = "Microsoft {app} для Mac"
kind = "office"
re = '(?i)^Microsoft\s+Macintosh\s+(?P<app>Word|Excel|PowerPoint|Outlook)(?:\s+(?P<v>\d+)\.\d+)?'
versions = [
  { v = "11", id = "mac{app_id}2004", name = "Microsoft {app} 2004 для Mac", released = 2004, eol = "2012-01-10" },
  { v = "12", id = "mac{app_id}2008", name = "Microsoft {app} 2008 для Mac", released = 2008, eol = "2013-04-09" },
  { v = "14", id = "mac{app_id}2011", name = "Microsoft {app} 2011 для Mac", released = 2010, eol = "2017-10-10" },
  { v = "15", id = "mac{app_id}2016", name = "Microsoft {app} 2016 для Mac", released = 2015, eol = "2020-10-13" },
  { v = "16", id = "mac{app_id}2019", name = "Microsoft {app} 2019+ / 365 для Mac", released = 2018 },
]

# app.xml: Application + AppVersion ("Microsoft Office Word 15.0000")
[[software]]
id = "{app_id}"
name = "Microsoft Office {app}"
kind = "office"
re = '(?i)^Microsoft(?:®)?\s+(?:Office\s+)?(?P<app>Word|Excel|PowerPoint|Outlook|Visio|Publisher|Access)(?:®)?\s+(?P<v>\d{1,2})\.\d+'
versions = [
  { v = "8", id = "{app_id}97", name = "Microsoft {app} 97", released = 1997, eol = "2004-01-16" },
  { v = "9", id = "{app_id}2000", name = "Microsoft {app} 2000", released = 1999, eol = "2009-07-14" },
  { v = "10", id = "{app_id}2002", name = "Microsoft {app} 2002 (XP)", released = 2001, eol = "2011-07-12" },
  { v = "11", id = "{app_id}2003", name = "Microsoft Office {app} 2003", released = 2003, eol = "2014-04-08" },
  { v = "12", id = "{app_id}2007", name = "Microsoft Office {app} 2007", released = 2007, eol = "2017-10-10" },
  { v = "14", id = "{app_id}2010", name = "Microsoft {app} 2010", released = 2010, eol = "2020-10-13" },
  { v = "15", id = "{app_id}2013", name = "Microsoft Office {app} 2013", released = 2013, eol = "2023-04-11" },
  { v = "16", id = "{app_id}2016", name = "Microsoft Office {app} 2016-2024 / 365", released = 2016 },
]

# OLE2 / app.xml without a version
[[software]]
id = "{app_id}"
name = "Microsoft Office {app}"
kind = "office"
re = '(?i)^Microsoft(?:®)?\s+(?:Office\s+)?(?P<app>Word|Excel|PowerPoint|Outlook|Visio|Publisher|Access)(?:®)?\s*$'

