[[os]]
id = "macos{key}"
name = "macOS {version}"
re = '(?i)(?:Mac\s+OS\s+X|macOS)\s*(?:Version\s*)?(?P<v>\d+(?:\.\d+)?)'
versions = [
  { v = "10", name = "Mac OS X {version}", legacy = true },
  { v = "11", name = "macOS 11 Big Sur", released = 2020, legacy = true },
  { v = "12", name = "macOS 12 Monterey", released = 2021, legacy = true },
  { v = "13", name = "macOS 13 Ventura", released = 2022 },
  { v = "14", name = "macOS 14 Sonoma", released = 2023 },
  { v = "15", name = "macOS 15 Sequoia", released = 2024 },
]

