# Finding rule → security standards (declarative, loaded by `foca_analysis::standards`).
#
# Every field is optional; a rule lists only correspondences that hold without a stretch.
# Sources (checked against the primary documents, see docs/STANDARDS.md):
#   mitre   : MITRE ATT&CK Enterprise v20 technique ids (same ids the rules already emit); none
#              is revoked or deprecated in the v20.0 STIX bundle.
#   cwe     : MITRE CWE ids; ids in the 2025 CWE Top 25 are flagged (`standards::CWE_TOP25_2025`).
#   owasp   : OWASP Top 10:2025 category; only when one of the rule's CWE ids is listed by OWASP
#              under that category (A03 also for vulnerable components without a CWE).
#              2021 → 2025: A01 → A01, A02 → A04, A05 → A02, A06 → A03, A07 → A07.
#   wstg    : OWASP Web Security Testing Guide v4.2 (stable) test ids. The ids shift
#              between WSTG versions (e.g. CONF-12 differs in v4.2 and in "latest").
#   iso27001: ISO/IEC 27001:2022 Annex A controls (adopted in Ukraine as ДСТУ ISO/IEC
#              27001:2023, IDT).
#   nist    : NIST SP 800-53 Rev. 5 (5.2.0) control ids. The НД ТЗІ 3.6-006-24 catalogue uses
#              the same measure codes; every id here is listed in its section 9.
#   privacy : personal data law articles for findings that expose personal data (GDPR,
#              Law of Ukraine No. 2297-VI "On Personal Data Protection").
#   ndtzi   : НД ТЗІ 2.5-004-99 functional security services (codes from section 4). Legacy:
#              for systems certified under КСЗІ. A code is given only where the finding shows a
#              failure of exactly that function of the protection complex (КЗЗ).
#   kszi    : НД ТЗІ 3.7-003-05 clause (stage/work of creating a КСЗІ) whose results the
#              finding feeds. Legacy: for systems certified under КСЗІ.
#
# The mapping is a guide for the auditor, not a conclusion of a КСЗІ expert examination.

[disclaimer]
uk = "Відповідність стандартам є орієнтиром для аудитора і не є висновком державної експертизи КСЗІ чи атестації. Остаточну оцінку відповідності робить уповноважений експерт за первинними документами."
ru = "Соответствие стандартам: ориентир для аудитора, а не заключение государственной экспертизы КСЗИ или аттестации. Окончательную оценку соответствия делает уполномоченный эксперт по первоисточникам."
en = "The standards mapping is a guide for the auditor, not the conclusion of a state КСЗІ (complex information security system) examination or certification. The final conformity assessment is made by an authorised expert against the primary documents."

