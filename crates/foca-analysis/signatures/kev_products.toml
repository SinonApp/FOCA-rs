# Offline CISA KEV mapping: which entries of the CISA Known Exploited
# Vulnerabilities catalog are comparable with the software FOCA-rs detects.
#
# Single source of truth for both sides:
# * `update_kev.py` keeps only KEV records whose `vendorProject` is in `vendors` (case-insensitive,
#   exact) and whose `product` matches `products` (Python/Rust-compatible regex, case-insensitive);
#   the record is tagged with every matching `key` and written to `kev.tsv.gz`;
# * `kev.rs` matches detected software / OS / web technology names against `match`
#   (case-insensitive) and reports the KEV records of the key.
#
# KEV has no version ranges: a match only says "this product has exploited CVEs, check the
# version", never "this host is vulnerable". Photoshop/Illustrator/InDesign, LibreOffice and
# nginx have no KEV records at the snapshot date, so they are not listed.
#
# kind: office | os | pdf | browser | server | web | mail | network | mobile | tool

[[product]]
key = "ms_office"
label = "Microsoft Office"
kind = "office"
vendors = ["Microsoft"]
products = '^(Office|Office Outlook|Outlook|Word|Excel|PowerPoint|Publisher|Project|Visual Basic for Applications.*|Office and WordPad|MSCOMCTL\.OCX)$'
match = 'microsoft.*\b(office|word|excel|powerpoint|outlook|publisher|visio|onenote|access|project)\b'

[[product]]
key = "ms_windows"
label = "Microsoft Windows"
kind = "os"
vendors = ["Microsoft"]
products = '^(Windows|Windows .*|Win32k|SMBv1.*|SMBv3|Graphics Device Interface.*|Graphics Component|DirectX.*|Task Scheduler|Netlogon|Remote Desktop Services|Kerberos.*|Active Directory|Ancillary Function Driver.*|Client-Server Run-time Subsystem.*|DWM Core Library|Internet Key Exchange.*|Enhanced Cryptographic Provider|WinVerifyTrust function|ATM Font Driver|HTTP Protocol Stack|HTTP\.sys|MSHTML|XML Core Services|Streaming Service.*|Update Notification Manager|SmartScreen Prompt|WordPad|Input Method Editor.*|Hyper-V.*)$'
match = '\bwindows\b'

[[product]]
key = "ms_ie"
label = "Microsoft Internet Explorer / Edge"
kind = "browser"
vendors = ["Microsoft"]
products = '^(Internet Explorer.*|Edge.*|Silverlight)$'
match = 'internet explorer|\bmsie\b|microsoft edge'

[[product]]
key = "ms_exchange"
label = "Microsoft Exchange Server"
kind = "mail"
vendors = ["Microsoft"]
products = '^Exchange( Server)?$'
match = '\bexchange\b|outlook web (app|access)|\bowa\b'

