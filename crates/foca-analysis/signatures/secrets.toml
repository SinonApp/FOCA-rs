# Rules for finding secrets in text and document fields, gitleaks style.
#
# Rule fields:
#   id       : stable identifier (part of the finding id, do not rename);
#   title    : finding title;
#   type     : secret type for the UI: conn | pass | api | host;
#   sev      : crit | high | warn | low | info;
#   re       : regular expression (Rust regex); the secret is group `s` (else the whole match),
#               the host is group `h` (optional);
#   keywords : fast prefilter: the rule runs only if the lowercased text contains at least
#               one of the words;
#   entropy  : minimum Shannon entropy of the value, bits/char (0 = no check);
#   validate : extra check in code against false positives:
#               password (not a placeholder or a word from the text), private_ip (RFC 1918, not a
#               version or clause number), internal_host (not part of a public name), key (not an example).
#
# Global allowlist (in code): EXAMPLE, xxxx, <…>, ${…}, {{…}}, ****, your_…, placeholder.

[[rule]]
id = "private-key"
title = "Закрытый ключ в документе"
type = "api"
sev = "crit"
re = '(?P<s>-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----\s*[A-Za-z0-9+/=]{16,64})'
keywords = ["private key"]

[[rule]]
id = "conn-string"
title = "Пароль в строке подключения"
type = "conn"
sev = "crit"
re = '''(?i)(?:data source|server|host|address|addr|dsn)\s*=\s*(?P<h>[^;"'\s]+)[^\n]{0,200}?;\s*(?:password|pwd)\s*=\s*(?P<s>[^;"'\r\n]{3,128})'''
keywords = ["password", "pwd"]
validate = "password"

[[rule]]
id = "conn-string-user"
title = "Пароль в строке подключения"
type = "conn"
sev = "crit"
re = '''(?i)(?:user id|uid|username)\s*=\s*[^;\r\n]{1,64};\s*(?:password|pwd)\s*=\s*(?P<s>[^;"'\r\n]{3,128})'''
keywords = ["password", "pwd"]
validate = "password"

[[rule]]
id = "uri-credentials"
title = "Учётные данные в URI"
type = "conn"
sev = "crit"
re = '''(?i)\b(?:mysql|postgres(?:ql)?|mongodb(?:\+srv)?|redis|amqps?|ftps?|sftp|smb|ldaps?|mssql|sqlserver|jdbc:[a-z]+|https?)://(?P<u>[^\s:/@"']{1,64}):(?P<s>[^\s@/"']{3,128})@(?P<h>[a-z0-9][a-z0-9.-]*)'''
keywords = ["://"]
validate = "password"

[[rule]]
id = "aws-access-key"
title = "Ключ доступа AWS"
type = "api"
sev = "crit"
re = '\b(?P<s>(?:AKIA|ASIA|ABIA|ACCA|AGPA|AIDA|AIPA|ANPA|ANVA|APKA|AROA|ASCA)[A-Z2-7]{16})\b'
keywords = ["akia", "asia", "abia", "acca", "agpa", "aida", "aipa", "anpa", "anva", "apka", "aroa", "asca"]
validate = "key"

[[rule]]
id = "aws-secret-key"
title = "Секретный ключ AWS"
type = "api"
sev = "crit"
re = '''(?i)aws.{0,20}?(?:secret|sk).{0,20}?\s*[:=]\s*["'«]?(?P<s>[A-Za-z0-9/+=]{40})(?:[^A-Za-z0-9/+=]|$)'''
keywords = ["aws"]
entropy = 3.5
validate = "key"

[[rule]]
id = "gcp-api-key"
title = "API-ключ Google Cloud"
type = "api"
sev = "high"
re = '\b(?P<s>AIza[0-9A-Za-z_\-]{35})(?:[^0-9A-Za-z_\-]|$)'
keywords = ["aiza"]
validate = "key"

[[rule]]
id = "gcp-service-account"
title = "Ключ сервисного аккаунта Google Cloud"
type = "api"
sev = "crit"
re = '"private_key_id"\s*:\s*"(?P<s>[a-f0-9]{40})"'
keywords = ["private_key_id"]

[[rule]]
id = "google-oauth-secret"
title = "Секрет OAuth-клиента Google"
type = "api"
sev = "high"
re = '\b(?P<s>GOCSPX-[A-Za-z0-9_\-]{28})'
keywords = ["gocspx-"]

[[rule]]
id = "azure-storage-key"
title = "Ключ хранилища Azure"
type = "api"
sev = "crit"
re = '(?i)AccountKey\s*=\s*(?P<s>[A-Za-z0-9+/]{86}==)'
keywords = ["accountkey"]

[[rule]]
id = "azure-sas"
title = "SAS-токен Azure"
type = "api"
sev = "high"
re = '''(?i)\bsv=\d{4}-\d\d-\d\d&[^\s"']*?\bsig=(?P<s>[A-Za-z0-9%+/=]{30,})'''
keywords = ["sig="]

[[rule]]
id = "azure-client-secret"
title = "Секрет приложения Azure AD"
type = "api"
sev = "crit"
re = '''(?i)(?:client[_-]?secret|azure[_-]?secret)\s*["']?\s*[:=]\s*["']?(?P<s>[A-Za-z0-9_~.\-]{30,44})'''
keywords = ["secret"]
entropy = 3.5
validate = "key"

[[rule]]
id = "github-token"
title = "Токен GitHub"
type = "api"
sev = "crit"
re = '\b(?P<s>(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{82}))\b'
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]

[[rule]]
id = "gitlab-token"
title = "Токен GitLab"
type = "api"
sev = "crit"
re = '\b(?P<s>glpat-[A-Za-z0-9_\-]{20})\b'
keywords = ["glpat-"]

[[rule]]
id = "slack-token"
title = "Токен Slack"
type = "api"
sev = "high"
re = '\b(?P<s>xox[baprs]-[0-9A-Za-z-]{10,250})'
keywords = ["xoxb-", "xoxa-", "xoxp-", "xoxr-", "xoxs-"]
validate = "key"

[[rule]]
id = "slack-webhook"
title = "Вебхук Slack"
type = "api"
sev = "high"
re = '(?P<s>https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24})'
keywords = ["hooks.slack.com"]

[[rule]]
id = "telegram-bot-token"
title = "Токен Telegram-бота"
type = "api"
sev = "high"
re = '\b(?P<s>\d{8,10}:AA[0-9A-Za-z_\-]{33})(?:[^0-9A-Za-z_\-]|$)'
keywords = [":aa"]

[[rule]]
id = "jwt"
title = "JWT-токен"
type = "api"
sev = "high"
re = '\b(?P<s>eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,})'
keywords = ["eyj"]

[[rule]]
id = "stripe-key"
title = "Секретный ключ Stripe"
type = "api"
sev = "crit"
re = '\b(?P<s>(?:sk|rk)_live_[0-9A-Za-z]{16,99})\b'
keywords = ["_live_"]

[[rule]]
id = "openai-key"
title = "API-ключ OpenAI"
type = "api"
sev = "crit"
re = '\b(?P<s>sk-(?:proj-|svcacct-)?[A-Za-z0-9_\-]{20,}T3BlbkFJ[A-Za-z0-9_\-]{20,})'
keywords = ["t3blbkfj"]

[[rule]]
id = "generic-api-key"
title = "API-ключ или токен в документе"
type = "api"
sev = "warn"
re = '''(?i)\b(?:api[_-]?key|apikey|api[_-]?token|access[_-]?token|auth[_-]?token|secret[_-]?key|bearer)\b["']?\s*[:=]?\s*["']?(?P<s>[A-Za-z0-9_\-+/=.]{16,128})'''
keywords = ["api", "token", "secret", "bearer"]
entropy = 3.5
validate = "key"

[[rule]]
id = "password"
title = "Пароль в тексте документа"
type = "pass"
sev = "high"
re = '''(?i)\b(?:password|passwd|passwort|pwd|парол[ьяюі]|пароль|пасворд)(?:\s+[\w«»"'-]{1,20}){0,3}?\s*(?:[:=]|\x{2014}|\x{2013}|\bis\b|\bє\b|\bэто\b)\s*["'«“]?(?P<s>[^\s"'»”,;]{4,64})'''
keywords = ["password", "passwd", "passwort", "pwd", "парол", "пасворд"]
validate = "password"

[[rule]]
id = "private-ip"
title = "Внутренний IP-адрес в документе"
type = "host"
sev = "low"
re = '\b(?P<s>(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3})\b'
keywords = ["10.", "192.168.", "172."]
validate = "private_ip"

[[rule]]
id = "internal-host"
title = "Внутреннее имя хоста в документе"
type = "host"
sev = "low"
re = '(?i)\b(?P<s>(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:local|lan|corp|internal|intranet|localdomain|home\.arpa))\b'
keywords = [".local", ".lan", ".corp", ".internal", ".intranet", ".localdomain", "home.arpa"]
validate = "internal_host"
