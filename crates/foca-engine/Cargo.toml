[package]
name = "foca-engine"
description = "FOCA-rs scan engine and command facade (Engine::invoke) for Tauri and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["report"]
# Reports and export via foca-report (report_build / export_build).
report = ["dep:foca-report"]

[dependencies]
tracing.workspace = true
tracing-core.workspace = true
foca-core.workspace = true
foca-meta.workspace = true
foca-analysis.workspace = true
foca-store.workspace = true
foca-net.workspace = true
foca-search = { workspace = true, features = ["store"] }
foca-fuzz.workspace = true
foca-recon.workspace = true
foca-report = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
thiserror.workspace = true
time.workspace = true
sha2.workspace = true
ring.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
zip.workspace = true
# compression backend for zip (logs_export)
flate2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# TLS stand of the infrastructure tests (same rustls + ring as foca-net)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile.workspace = true
